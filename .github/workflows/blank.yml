name: Build Delivery Analyzer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DeliveryAnalyzer-Android-v0.2/DeliveryAnalyzer

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project structure
        run: |
          pwd
          ls -la
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryAnalyzer-APK
          path: DeliveryAnalyzer-Android-v0.2/DeliveryAnalyzer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
